  <text fill="#166534" font-family="system-ui, sans-serif" font-size="10" font-weight="600" id="svg_24" x="277" y="218">Output Format</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_25" x="277" y="233">Per company, up to 3 roles:</text>
