  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_15" x="62" y="233">• TEDLAR_CONTEXT</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_16" x="62" y="246">• Analyze org structure based on</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_17" x="67" y="259">company size &amp; business model</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_18" x="62" y="275">• Identify up to 3 decision-makers</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_19" x="62" y="288">• Map Tedlar use cases to each role</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_20" x="62" y="301">• Why would THEY care about Tedlar?</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_21" x="62" y="317">• Use standard, searchable titles</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_22" x="67" y="330">(e.g., &quot;VP of Product Development&quot;)</text>
