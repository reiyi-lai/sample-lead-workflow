  <text fill="#6b7280" font-family="system-ui, sans-serif" font-size="9" id="svg_50" transform="matrix(1 0 0 1 -1 -54)" x="75" y="575">Sent to Clay Webhook URL for enrichment (Company Name, Domain, Role Title to search)</text>
