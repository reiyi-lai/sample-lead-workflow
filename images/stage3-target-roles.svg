<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="monospace" font-size="13">
  <!-- Background -->
  <rect width="680" height="300" fill="#ffffff"/>

  <!-- Outer border -->
  <rect x="10" y="10" width="660" height="280" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Header -->
  <rect x="10" y="10" width="660" height="32" fill="#ffedd5" stroke="#374151" stroke-width="1"/>
  <text x="24" y="32" font-weight="bold" fill="#ea580c">STAGE 3: TARGET ROLE IDENTIFICATION</text>

  <!-- Divider line under header -->
  <line x1="10" y1="42" x2="670" y2="42" stroke="#374151" stroke-width="1"/>

  <!-- Trigger info -->
  <rect x="10" y="42" width="660" height="28" fill="#fef2f2"/>
  <text x="24" y="62" fill="#dc2626">⚡ Auto-triggers when Stage 2 scores company as Tier 1 or Tier 2</text>

  <!-- Divider -->
  <line x1="10" y1="70" x2="670" y2="70" stroke="#374151" stroke-width="1"/>

  <!-- Vertical divider -->
  <line x1="340" y1="70" x2="340" y2="230" stroke="#374151" stroke-width="1"/>

  <!-- Input -->
  <text x="24" y="95" font-weight="bold" fill="#1e1e1e">Input</text>
  <text x="24" y="115" fill="#6b7280">From Stage 2:</text>
  <text x="24" y="140" fill="#1e1e1e">• Company research data</text>
  <text x="24" y="160" fill="#1e1e1e">• ICP scoring breakdown</text>
  <text x="24" y="180" fill="#1e1e1e">• Identified pain points</text>
  <text x="24" y="200" fill="#1e1e1e">• Strategic priorities</text>

  <!-- Process -->
  <text x="354" y="95" font-weight="bold" fill="#1e1e1e">Process</text>
  <text x="354" y="115" fill="#6b7280">Tool: Claude LLM</text>
  <text x="354" y="140" fill="#1e1e1e">• Analyze org structure</text>
  <text x="354" y="160" fill="#1e1e1e">• Identify decision-makers</text>
  <text x="354" y="180" fill="#1e1e1e">• Rank by purchasing authority</text>
  <text x="354" y="200" fill="#1e1e1e">• Generate outreach rationale</text>

  <!-- Divider line -->
  <line x1="10" y1="230" x2="670" y2="230" stroke="#374151" stroke-width="1"/>

  <!-- Output summary -->
  <rect x="10" y="230" width="660" height="60" fill="#f0fdf4"/>
  <text x="24" y="255" font-weight="bold" fill="#1e1e1e">Output per company: 3 prioritized target roles</text>
  <text x="24" y="275" fill="#6b7280">Each with: title, rationale, LinkedIn Sales Navigator search URL</text>
</svg>
