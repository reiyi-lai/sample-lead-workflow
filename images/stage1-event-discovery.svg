<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="monospace" font-size="13">
  <!-- Background -->
  <rect width="680" height="320" fill="#ffffff"/>

  <!-- Outer border -->
  <rect x="10" y="10" width="660" height="300" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Header -->
  <rect x="10" y="10" width="660" height="32" fill="#dbeafe" stroke="#374151" stroke-width="1"/>
  <text x="24" y="32" font-weight="bold" fill="#1e40af">STAGE 1: EVENT DISCOVERY</text>

  <!-- Divider line under header -->
  <line x1="10" y1="42" x2="670" y2="42" stroke="#374151" stroke-width="1"/>

  <!-- Vertical divider -->
  <line x1="340" y1="42" x2="340" y2="240" stroke="#374151" stroke-width="1"/>

  <!-- Step 1.1 -->
  <text x="24" y="65" font-weight="bold" fill="#1e1e1e">Step 1.1: Discover</text>
  <text x="24" y="85" fill="#6b7280">Tool: Claude WebSearch</text>
  <text x="24" y="115" fill="#1e1e1e">• Sign industry shows</text>
  <text x="24" y="135" fill="#1e1e1e">• Graphics/printing</text>
  <text x="24" y="155" fill="#1e1e1e">• Vehicle wrap events</text>
  <text x="24" y="175" fill="#1e1e1e">• Architectural</text>
  <text x="24" y="205" fill="#059669" font-weight="bold">Output: 22 events</text>

  <!-- Step 1.2 -->
  <text x="354" y="65" font-weight="bold" fill="#1e1e1e">Step 1.2: Score &amp; Filter</text>
  <text x="354" y="85" fill="#6b7280">Tool: Claude LLM</text>
  <text x="354" y="115" fill="#1e1e1e">Scoring (each 0-10):</text>
  <text x="354" y="135" fill="#1e1e1e">• Industry Alignment (50%)</text>
  <text x="354" y="155" fill="#1e1e1e">• Exhibitor Quality (30%)</text>
  <text x="354" y="175" fill="#1e1e1e">• Scale &amp; Timing (20%)</text>
  <text x="354" y="205" fill="#059669">Tier 1 (8-10): 11 → Proceed</text>
  <text x="354" y="222" fill="#ca8a04">Tier 2 (5-7.9): 9 → If budget</text>
  <text x="354" y="239" fill="#dc2626">Tier 3 (&lt;5): 2 → Skip</text>

  <!-- Divider line -->
  <line x1="10" y1="250" x2="670" y2="250" stroke="#374151" stroke-width="1"/>

  <!-- Step 1.3 -->
  <rect x="10" y="250" width="660" height="60" fill="#f0fdf4"/>
  <text x="24" y="275" font-weight="bold" fill="#1e1e1e">Step 1.3: Company Discovery (for Tier 1 events)</text>
  <text x="24" y="295" fill="#6b7280">Tool: Claude WebSearch → Output: 37 unique companies with booth/website info</text>
</svg>
