<?xml version="1.0"?>
<svg width="700" height="900" viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Pipeline V2: Parallel Research Agents + Outreach Agent</text>

  <!-- Stage 1.1 & 1.2: Event Discovery & Scoring (unchanged) -->
  <rect x="200" y="50" width="300" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="350" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#374151">STAGE 1: EVENT DISCOVERY</text>
  <text x="350" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">1.1 Discover Events → 1.2 Score &amp; Filter</text>

  <!-- Arrow down -->
  <line x1="350" y1="110" x2="350" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="130" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">Qualified events (score ≥ 8)</text>

  <!-- PARALLEL RESEARCH AGENTS BOX -->
  <rect x="50" y="150" width="600" height="280" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="350" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">PARALLEL RESEARCH AGENTS (max 3 concurrent)</text>

  <!-- Agent 1 -->
  <rect x="70" y="195" width="180" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Agent 1: ISA Sign Expo</text>
  <text x="80" y="235" font-family="system-ui, sans-serif" font-size="9" fill="#374151">1. Discover companies</text>
  <text x="80" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#374151">2. For each company:</text>
  <text x="90" y="265" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Check dedup (file exists?)</text>
  <text x="90" y="280" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Claim with file lock</text>
  <text x="90" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Research &amp; Score</text>
  <text x="90" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a">• → Callback if qualified</text>

  <!-- Agent 2 -->
  <rect x="260" y="195" width="180" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Agent 2: PRINTING United</text>
  <text x="270" y="235" font-family="system-ui, sans-serif" font-size="9" fill="#374151">1. Discover companies</text>
  <text x="270" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#374151">2. For each company:</text>
  <text x="280" y="265" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Check dedup (file exists?)</text>
  <text x="280" y="280" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Claim with file lock</text>
  <text x="280" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Research &amp; Score</text>
  <text x="280" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a">• → Callback if qualified</text>

  <!-- Agent 3 -->
  <rect x="450" y="195" width="180" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Agent 3: FESPA Global</text>
  <text x="460" y="235" font-family="system-ui, sans-serif" font-size="9" fill="#374151">1. Discover companies</text>
  <text x="460" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#374151">2. For each company:</text>
  <text x="470" y="265" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Check dedup (file exists?)</text>
  <text x="470" y="280" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Claim with file lock</text>
  <text x="470" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">• Research &amp; Score</text>
  <text x="470" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a">• → Callback if qualified</text>

  <!-- Dedup explanation -->
  <rect x="70" y="325" width="560" height="45" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="350" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">DEDUPLICATION: File-based locking prevents duplicate research</text>
  <text x="350" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#78350f">If "Epson" appears at multiple events, first agent to claim it wins → others skip</text>

  <!-- Shared Rate Limiter -->
  <rect x="70" y="380" width="560" height="25" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="350" y="397" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4338ca">🔒 SHARED RATE LIMITER (30k tokens/min across all agents)</text>

  <!-- Convergence point -->
  <text x="350" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">asyncio.gather() - wait for all agents</text>

  <!-- Callback arrows from agents -->
  <path d="M 160 315 Q 160 470 270 470" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowhead-green)"/>
  <path d="M 350 315 L 350 455" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead-green)"/>
  <path d="M 540 315 Q 540 470 430 470" stroke="#16a34a" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowhead-green)"/>

  <!-- Callback label -->
  <text x="580" y="400" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" font-style="italic">on_company_scored()</text>
  <text x="580" y="412" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" font-style="italic">callbacks fire</text>
  <text x="580" y="424" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" font-style="italic">immediately</text>

  <!-- Stage 3 -->
  <rect x="200" y="460" width="300" height="70" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="350" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#374151">STAGE 3: TARGET ROLE IDENTIFICATION</text>
  <text x="350" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">Identify 2-3 decision-makers per company</text>
  <text x="350" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">Generate LinkedIn Sales Nav URLs + Push to Clay</text>

  <!-- Arrow down -->
  <line x1="350" y1="530" x2="350" y2="560" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="550" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" font-style="italic">on_target_roles_identified()</text>

  <!-- OUTREACH AGENT BOX -->
  <rect x="100" y="570" width="500" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="350" y="595" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#166534">OUTREACH AGENT (per company)</text>

  <!-- Multi-turn conversation diagram -->
  <rect x="120" y="610" width="460" height="140" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="350" y="630" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#166534">Single Multi-Turn Conversation</text>

  <!-- Context box -->
  <rect x="135" y="645" width="120" height="45" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="195" y="662" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#166534">Company Context</text>
  <text x="195" y="676" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">(sent ONCE)</text>
  <text x="195" y="686" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#15803d">~3-4k tokens</text>

  <!-- Arrow right -->
  <line x1="260" y1="668" x2="280" y2="668" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

  <!-- Role boxes -->
  <rect x="285" y="645" width="85" height="45" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="327" y="662" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Role 1</text>
  <text x="327" y="674" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#6b7280">Analyze</text>
  <text x="327" y="684" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#6b7280">Outreach</text>

  <line x1="375" y1="668" x2="390" y2="668" stroke="#16a34a" stroke-width="1"/>

  <rect x="395" y="645" width="85" height="45" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="437" y="662" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Role 2</text>
  <text x="437" y="674" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#6b7280">Analyze</text>
  <text x="437" y="684" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#6b7280">Outreach</text>

  <line x1="485" y1="668" x2="500" y2="668" stroke="#16a34a" stroke-width="1"/>

  <rect x="505" y="645" width="60" height="45" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="535" y="668" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#166534">Role 3</text>
  <text x="535" y="680" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#6b7280">...</text>

  <!-- Token savings callout -->
  <rect x="135" y="700" width="430" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="350" y="715" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e">~70% TOKEN SAVINGS vs per-role calls</text>
  <text x="350" y="728" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#78350f">Old: 3 roles × context each = ~20k tokens | New: 1 conversation = ~6k tokens</text>

  <!-- Output -->
  <line x1="350" y1="770" x2="350" y2="800" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Final outputs -->
  <rect x="150" y="810" width="400" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="835" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">OUTPUT: Ready for Outreach</text>
  <text x="350" y="855" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1e40af">📄 {Role}_analysis.json + {Role}_outreach.json per company</text>
  <text x="350" y="870" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1e40af">🔗 LinkedIn Sales Nav URLs + Clay webhook triggered</text>

</svg>
