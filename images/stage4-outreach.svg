<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="monospace" font-size="13">
  <!-- Background -->
  <rect width="680" height="300" fill="#ffffff"/>

  <!-- Outer border -->
  <rect x="10" y="10" width="660" height="280" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Header -->
  <rect x="10" y="10" width="660" height="32" fill="#dcfce7" stroke="#374151" stroke-width="1"/>
  <text x="24" y="32" font-weight="bold" fill="#16a34a">STAGE 4: OUTREACH GENERATION</text>

  <!-- Divider line under header -->
  <line x1="10" y1="42" x2="670" y2="42" stroke="#374151" stroke-width="1"/>

  <!-- Vertical dividers for 3 columns -->
  <line x1="230" y1="42" x2="230" y2="230" stroke="#374151" stroke-width="1"/>
  <line x1="450" y1="42" x2="450" y2="230" stroke="#374151" stroke-width="1"/>

  <!-- Input -->
  <text x="24" y="65" font-weight="bold" fill="#1e1e1e">Input</text>
  <text x="24" y="90" fill="#1e1e1e">• Company research</text>
  <text x="24" y="110" fill="#1e1e1e">• ICP scores</text>
  <text x="24" y="130" fill="#1e1e1e">• Target role</text>
  <text x="24" y="150" fill="#1e1e1e">• Role rationale</text>
  <text x="24" y="170" fill="#1e1e1e">• Pain points</text>

  <!-- Step 4.1 -->
  <text x="244" y="65" font-weight="bold" fill="#1e1e1e">Step 4.1: Analysis</text>
  <text x="244" y="85" fill="#6b7280">Tool: Claude LLM</text>
  <text x="244" y="110" fill="#1e1e1e">• Find personal hooks</text>
  <text x="244" y="130" fill="#1e1e1e">• Determine angle</text>
  <text x="244" y="150" fill="#1e1e1e">• Match pain points</text>
  <text x="244" y="170" fill="#1e1e1e">• Identify triggers</text>

  <!-- Step 4.2 -->
  <text x="464" y="65" font-weight="bold" fill="#1e1e1e">Step 4.2: Generate</text>
  <text x="464" y="85" fill="#6b7280">Tool: Claude LLM</text>
  <text x="464" y="110" fill="#1e1e1e">• 80-150 word email</text>
  <text x="464" y="130" fill="#1e1e1e">• Consultative tone</text>
  <text x="464" y="150" fill="#1e1e1e">• Company-specific</text>
  <text x="464" y="170" fill="#1e1e1e">• Soft CTA</text>

  <!-- Divider line -->
  <line x1="10" y1="230" x2="670" y2="230" stroke="#374151" stroke-width="1"/>

  <!-- Output summary -->
  <rect x="10" y="230" width="660" height="60" fill="#dbeafe"/>
  <text x="24" y="255" font-weight="bold" fill="#1e1e1e">Output: Personalized outreach message</text>
  <text x="24" y="275" fill="#6b7280">Subject line + email body with company-specific hooks and value proposition</text>
</svg>
