<?xml version="1.0"?>
<svg width="520" height="580" viewBox="0 0 690 770" xmlns="http://www.w3.org/2000/svg">
 <g style="font-family: system-ui, sans-serif">
  <!-- Background -->
  <rect fill="#ffffff" height="770" width="690" x="0" y="0"/>

  <!-- ==================== STAGE HEADER ==================== -->
  <rect fill="#e5e7eb" height="40" rx="6" stroke="#9ca3af" stroke-width="1.5" width="650" x="20" y="20"/>
  <text fill="#374151" font-size="16" font-weight="bold" text-anchor="middle" x="345" y="46">STAGE 2: COMPANY RESEARCH &amp; QUALIFICATION</text>

  <!-- ==================== INPUT FROM STAGE 1 ==================== -->
  <rect fill="#e0e7ff" height="55" rx="6" stroke="#6366f1" stroke-width="1.5" width="420" x="135" y="80"/>
  <text fill="#4338ca" font-size="11" font-weight="bold" text-anchor="middle" x="345" y="100">INPUT: Discovered Companies (from Stage 1)</text>
  <text fill="#4338ca" font-size="10" text-anchor="middle" x="345" y="118">Deduplicated by website URL across all events</text>

  <!-- Arrow down -->
  <line stroke="#374151" stroke-width="2" x1="345" x2="345" y1="135" y2="170"/>
  <polygon fill="#374151" points="340,165 345,175 350,165"/>

  <!-- ==================== SEQUENTIAL PROCESSING INDICATOR ==================== -->
  <rect fill="#eff6ff" height="30" rx="4" stroke="#2563eb" stroke-dasharray="4,2" width="580" x="55" y="180"/>
  <text fill="#1e40af" font-size="10" font-weight="600" text-anchor="middle" x="345" y="200">SEQUENTIAL: Process one company at a time (rate limit: ~3 calls/min)</text>

  <!-- Arrow down -->
  <line stroke="#374151" stroke-width="2" x1="345" x2="345" y1="210" y2="245"/>
  <polygon fill="#374151" points="340,240 345,250 350,240"/>

  <!-- ==================== STEP 2.1: RESEARCH & SCORE ==================== -->
  <rect fill="#ffffff" height="280" rx="6" stroke="#374151" stroke-width="1.5" width="610" x="40" y="255"/>

  <!-- Step header -->
  <rect fill="#f3f4f6" height="32" rx="6" stroke="#374151" width="610" x="40" y="255"/>
  <text fill="#1f2937" font-size="11" font-weight="bold" x="52" y="275">Step 2.1: Research &amp; Score Company</text>
  <text fill="#6b7280" font-size="10" x="480" y="275">LLM (WebSearch)</text>

  <!-- Resume check -->
  <rect fill="#fef3c7" height="26" rx="4" stroke="#f59e0b" width="580" x="55" y="295"/>
  <text fill="#92400e" font-size="9" text-anchor="middle" x="345" y="312">RESUME: Skip if scoring.json already exists for this company</text>

  <!-- System Prompt box -->
  <rect fill="#fef9c3" height="170" rx="4" stroke="#ca8a04" stroke-dasharray="4,2" width="270" x="52" y="330"/>
  <text fill="#854d0e" font-size="10" font-weight="600" x="62" y="346">System Prompt</text>
  <text fill="#1f2937" font-size="9" x="62" y="363">- TEDLAR_CONTEXT (ICP definition)</text>
  <text fill="#1f2937" font-size="9" x="62" y="379">- Research company via web search:</text>
  <text fill="#1f2937" font-size="9" x="70" y="392">website, news, LinkedIn, databases</text>
  <text fill="#1f2937" font-size="9" x="62" y="408">- Score categories (1-10 each):</text>
  <text fill="#1f2937" font-size="9" x="70" y="421">- Industry Fit (30%)</text>
  <text fill="#1f2937" font-size="9" x="70" y="434">- Size/Revenue Fit (25%)</text>
  <text fill="#1f2937" font-size="9" x="70" y="447">- Strategic Relevtic (25%)</text>
  <text fill="#1f2937" font-size="9" x="70" y="460">- Market Activity (20%)</text>
  <text fill="#1f2937" font-size="9" x="62" y="480">- Evidence-based rationale per score</text>

  <!-- Output box -->
  <rect fill="#dcfce7" height="170" rx="4" stroke="#16a34a" width="260" x="340" y="330"/>
  <text fill="#166534" font-size="10" font-weight="600" x="350" y="346">Output Format</text>
  <text fill="#1f2937" font-size="9" x="350" y="363">- company_name, website_url</text>
  <text fill="#1f2937" font-size="9" x="350" y="379">- scores: {category: score, rationale}</text>
  <text fill="#1f2937" font-size="9" x="350" y="395">- qualification_summary</text>
  <text fill="#1f2937" font-size="9" x="350" y="415"/>
  <text fill="#166534" font-size="9" font-weight="600" x="350" y="428">Step 2.2: Calculate weighted ICP score</text>
  <text fill="#1f2937" font-size="9" x="350" y="444">- icp_qualification.weighted_score</text>
  <text fill="#1f2937" font-size="9" x="350" y="457">- icp_qualification.category_scores</text>
  <text fill="#1f2937" font-size="9" x="350" y="473">- Weighted formula applied in code</text>
  <text fill="#1f2937" font-size="9" x="350" y="486">- Score scaled to 0-100</text>

  <!-- JSON save indicator -->
  <line stroke="#2563eb" stroke-width="1.5" x1="470" x2="470" y1="500" y2="520"/>
  <line stroke="#2563eb" stroke-width="1.5" x1="470" x2="520" y1="520" y2="520"/>
  <polygon fill="#2563eb" points="515,516 525,520 515,524"/>
  <rect fill="#dbeafe" height="26" rx="3" stroke="#2563eb" width="160" x="490" y="507"/>
  <text fill="#1e40af" font-size="9" x="500" y="524">companies/{co}/scoring.json</text>

  <!-- ==================== CALLBACK ARROW ==================== -->
  <line stroke="#374151" stroke-width="2" x1="345" x2="345" y1="535" y2="580"/>
  <polygon fill="#374151" points="340,575 345,585 350,575"/>

  <!-- Qualification check -->
  <rect fill="#dcfce7" height="45" rx="6" stroke="#16a34a" stroke-width="1.5" width="450" x="120" y="590"/>
  <text fill="#166534" font-size="10" font-weight="bold" text-anchor="middle" x="345" y="608">If weighted_score >= 70: Qualified for Stage 3</text>
  <text fill="#16a34a" font-size="9" text-anchor="middle" x="345" y="625">Companies below cutoff are logged but not processed further</text>

  <!-- ==================== OUTPUT TO STAGE 3 ==================== -->
  <line stroke="#16a34a" stroke-width="2" stroke-dasharray="4,2" x1="345" x2="345" y1="635" y2="675"/>
  <polygon fill="#16a34a" points="340,670 345,680 350,670"/>

  <!-- Output summary box -->
  <rect fill="#e0e7ff" height="55" rx="6" stroke="#6366f1" stroke-width="1.5" width="400" x="145" y="690"/>
  <text fill="#4338ca" font-size="11" font-weight="bold" text-anchor="middle" x="345" y="712">OUTPUT TO STAGE 3</text>
  <text fill="#4338ca" font-size="10" text-anchor="middle" x="345" y="730">Qualified companies with scoring data (score >= 70)</text>

 </g>
</svg>
