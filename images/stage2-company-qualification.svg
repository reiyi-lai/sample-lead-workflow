<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="monospace" font-size="13">
  <!-- Background -->
  <rect width="680" height="340" fill="#ffffff"/>

  <!-- Outer border -->
  <rect x="10" y="10" width="660" height="320" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- Header -->
  <rect x="10" y="10" width="660" height="32" fill="#ede9fe" stroke="#374151" stroke-width="1"/>
  <text x="24" y="32" font-weight="bold" fill="#7c3aed">STAGE 2: COMPANY QUALIFICATION</text>

  <!-- Divider line under header -->
  <line x1="10" y1="42" x2="670" y2="42" stroke="#374151" stroke-width="1"/>

  <!-- Vertical divider -->
  <line x1="340" y1="42" x2="340" y2="260" stroke="#374151" stroke-width="1"/>

  <!-- Step 2.1 -->
  <text x="24" y="65" font-weight="bold" fill="#1e1e1e">Step 2.1: Deep Research</text>
  <text x="24" y="85" fill="#6b7280">Tool: Claude WebSearch</text>
  <text x="24" y="115" fill="#1e1e1e">For each company:</text>
  <text x="24" y="135" fill="#1e1e1e">• Company overview &amp; history</text>
  <text x="24" y="155" fill="#1e1e1e">• Products/services offered</text>
  <text x="24" y="175" fill="#1e1e1e">• Revenue &amp; employee count</text>
  <text x="24" y="195" fill="#1e1e1e">• Recent news &amp; initiatives</text>
  <text x="24" y="215" fill="#1e1e1e">• Trade show presence</text>
  <text x="24" y="245" fill="#059669" font-weight="bold">Output: research.json</text>

  <!-- Step 2.2 -->
  <text x="354" y="65" font-weight="bold" fill="#1e1e1e">Step 2.2: ICP Scoring</text>
  <text x="354" y="85" fill="#6b7280">Tool: Claude LLM</text>
  <text x="354" y="115" fill="#1e1e1e">Scoring Categories:</text>
  <text x="354" y="135" fill="#1e1e1e">• Industry Fit (30%)</text>
  <text x="354" y="155" fill="#1e1e1e">• Size/Revenue (25%)</text>
  <text x="354" y="175" fill="#1e1e1e">• Strategic Relevance (20%)</text>
  <text x="354" y="195" fill="#1e1e1e">• Market Activity (25%)</text>
  <text x="354" y="225" fill="#059669">Tier 1 (85+): 5 companies</text>
  <text x="354" y="242" fill="#ca8a04">Tier 2 (70-84): 2 companies</text>
  <text x="354" y="259" fill="#dc2626">Tier 3 (55-69): 1 company</text>

  <!-- Divider line -->
  <line x1="10" y1="270" x2="670" y2="270" stroke="#374151" stroke-width="1"/>

  <!-- Output summary -->
  <rect x="10" y="270" width="660" height="60" fill="#f0fdf4"/>
  <text x="24" y="295" font-weight="bold" fill="#1e1e1e">Output: 8 qualified companies → proceed to Stage 3</text>
  <text x="24" y="315" fill="#6b7280">Each with: scoring.json (scores + rationale per category)</text>
</svg>
