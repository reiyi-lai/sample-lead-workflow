  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_52" x="277" y="484">• rationale per score</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_53" x="277" y="497">• overall_score</text>
