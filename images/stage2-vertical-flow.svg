  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_46" x="67" y="523">- Market Activity (25%)</text>
  <text fill="#1f2937" font-family="system-ui, sans-serif" font-size="9" id="svg_47" style="cursor: move;" x="62" y="543">• Tier thresholds:</text>
