<?xml version="1.0"?>
<svg width="520" height="640" viewBox="0 0 690 850" xmlns="http://www.w3.org/2000/svg">
 <g style="font-family: system-ui, sans-serif">
  <!-- Background -->
  <rect fill="#ffffff" height="850" width="690" x="0" y="0"/>

  <!-- ==================== STAGE HEADER ==================== -->
  <rect fill="#e5e7eb" height="40" rx="6" stroke="#9ca3af" stroke-width="1.5" width="650" x="20" y="20"/>
  <text fill="#374151" font-size="16" font-weight="bold" text-anchor="middle" x="345" y="46">STAGE 3: TARGET ROLE IDENTIFICATION</text>

  <!-- ==================== INPUT FROM STAGE 2 ==================== -->
  <rect fill="#e0e7ff" height="65" rx="6" stroke="#6366f1" stroke-width="1.5" width="400" x="145" y="80"/>
  <text fill="#4338ca" font-size="11" font-weight="bold" text-anchor="middle" x="345" y="100">INPUT: Qualified Companies (from Stage 2)</text>
  <text fill="#4338ca" font-size="10" text-anchor="middle" x="345" y="118">Triggered by on_company_scored() callback</text>
  <text fill="#6366f1" font-size="9" font-style="italic" text-anchor="middle" x="345" y="135">*Multiple companies processed concurrently via callbacks</text>

  <!-- Arrow down -->
  <line stroke="#374151" stroke-width="2" x1="345" x2="345" y1="145" y2="180"/>
  <polygon fill="#374151" points="340,175 345,185 350,175"/>

  <!-- ==================== STEP 3.1: IDENTIFY TARGET ROLES ==================== -->
  <rect fill="#ffffff" height="230" rx="6" stroke="#374151" stroke-width="1.5" width="610" x="40" y="190"/>

  <!-- Step header -->
  <rect fill="#f3f4f6" height="32" rx="6" stroke="#374151" width="610" x="40" y="190"/>
  <text fill="#1f2937" font-size="11" font-weight="bold" x="52" y="210">Step 3.1: Identify Target Roles</text>
  <text fill="#6b7280" font-size="10" x="560" y="210">LLM</text>

  <!-- System Prompt box -->
  <rect fill="#fef9c3" height="150" rx="4" stroke="#ca8a04" stroke-dasharray="4,2" width="270" x="52" y="232"/>
  <text fill="#854d0e" font-size="10" font-weight="600" x="62" y="248">System Prompt</text>
  <text fill="#1f2937" font-size="9" x="62" y="265">- TEDLAR_CONTEXT</text>
  <text fill="#1f2937" font-size="9" x="62" y="278">- Analyze org structure based on</text>
  <text fill="#1f2937" font-size="9" x="70" y="291">company size &amp; business model</text>
  <text fill="#1f2937" font-size="9" x="62" y="307">- Identify up to 3 decision-makers</text>
  <text fill="#1f2937" font-size="9" x="62" y="320">- Map Tedlar use cases to each role</text>
  <text fill="#1f2937" font-size="9" x="62" y="333">- Why would THEY care about Tedlar?</text>
  <text fill="#1f2937" font-size="9" x="62" y="349">- Use standard, searchable titles</text>
  <text fill="#1f2937" font-size="9" x="70" y="362">(e.g., "VP of Product Development")</text>

  <!-- Output box -->
  <rect fill="#dcfce7" height="150" rx="4" stroke="#16a34a" width="260" x="340" y="232"/>
  <text fill="#166534" font-size="10" font-weight="600" x="350" y="248">Output Format</text>
  <text fill="#1f2937" font-size="9" x="350" y="265">Per company, up to 3 roles:</text>
  <text fill="#1f2937" font-size="9" x="350" y="281">- title (searchable format)</text>
  <text fill="#1f2937" font-size="9" x="350" y="294">- priority (1, 2, or 3)</text>
  <text fill="#1f2937" font-size="9" x="350" y="307">- rationale (why this role matters,</text>
  <text fill="#1f2937" font-size="9" x="358" y="320">use cases, how Tedlar benefits</text>
  <text fill="#1f2937" font-size="9" x="358" y="333">them specifically)</text>

  <!-- JSON save indicator -->
  <line stroke="#2563eb" stroke-width="1.5" x1="470" x2="470" y1="382" y2="405"/>
  <line stroke="#2563eb" stroke-width="1.5" x1="470" x2="515" y1="405" y2="405"/>
  <polygon fill="#2563eb" points="510,401 520,405 510,409"/>
  <rect fill="#dbeafe" height="26" rx="3" stroke="#2563eb" width="175" x="475" y="392"/>
  <text fill="#1e40af" font-size="9" x="485" y="409">companies/{co}/target_roles.json</text>

  <!-- ==================== ARROW TO STEP 3.2 ==================== -->
  <line stroke="#374151" stroke-width="2" x1="345" x2="345" y1="420" y2="455"/>
  <polygon fill="#374151" points="340,450 345,460 350,450"/>

  <!-- ==================== STEP 3.2: GENERATE LINKEDIN URLS + CLAY ==================== -->
  <rect fill="#ffffff" height="140" rx="6" stroke="#374151" stroke-width="1.5" width="610" x="40" y="465"/>

  <!-- Step header -->
  <rect fill="#f3f4f6" height="32" rx="6" stroke="#374151" width="610" x="40" y="465"/>
  <text fill="#1f2937" font-size="11" font-weight="bold" x="52" y="485">Step 3.2: Generate LinkedIn URLs + Push to Clay</text>
  <text fill="#6b7280" font-size="10" x="520" y="485">Code logic</text>

  <!-- Two column layout -->
  <!-- LinkedIn URLs box -->
  <rect fill="#dbeafe" height="70" rx="4" stroke="#2563eb" width="270" x="52" y="507"/>
  <text fill="#1e40af" font-size="10" font-weight="600" x="62" y="523">LinkedIn Sales Navigator URLs</text>
  <text fill="#1f2937" font-size="9" x="62" y="540">- Generate search URL per role</text>
  <text fill="#1f2937" font-size="9" x="62" y="553">- Company domain + role title</text>
  <text fill="#1f2937" font-size="9" x="62" y="566">- Save to linkedin_searches.json</text>

  <!-- Clay webhook box -->
  <rect fill="#fce7f3" height="70" rx="4" stroke="#db2777" width="260" x="340" y="507"/>
  <text fill="#be185d" font-size="10" font-weight="600" x="350" y="523">Clay Webhook Push</text>
  <text fill="#1f2937" font-size="9" x="350" y="540">- company_name, website_url</text>
  <text fill="#1f2937" font-size="9" x="350" y="553">- role_titles[], icp_score</text>
  <text fill="#1f2937" font-size="9" x="350" y="566">- For contact enrichment</text>

  <!-- JSON save indicator for linkedin_searches -->
  <line stroke="#2563eb" stroke-width="1.5" x1="187" x2="187" y1="577" y2="595"/>
  <line stroke="#2563eb" stroke-width="1.5" x1="187" x2="40" y1="595" y2="595"/>
  <polygon fill="#2563eb" points="45,591 35,595 45,599"/>
  <rect fill="#dbeafe" height="26" rx="3" stroke="#2563eb" width="195" x="40" y="582"/>
  <text fill="#1e40af" font-size="9" x="50" y="599">companies/{co}/linkedin_searches.json</text>

  <!-- ==================== CALLBACK ARROW ==================== -->
  <line stroke="#374151" stroke-width="2" x1="345" x2="345" y1="605" y2="645"/>
  <polygon fill="#374151" points="340,640 345,650 350,640"/>

  <!-- Callback trigger box -->
  <rect fill="#dcfce7" height="45" rx="6" stroke="#16a34a" stroke-width="1.5" width="450" x="120" y="655"/>
  <text fill="#166534" font-size="10" font-weight="bold" text-anchor="middle" x="345" y="673">Trigger on_target_roles_identified() callback</text>
  <text fill="#16a34a" font-size="9" text-anchor="middle" x="345" y="690">→ Auto-triggers Stage 4 for all roles</text>

  <!-- ==================== OUTPUT TO STAGE 4 ==================== -->
  <line stroke="#16a34a" stroke-width="2" stroke-dasharray="4,2" x1="345" x2="345" y1="700" y2="740"/>
  <polygon fill="#16a34a" points="340,735 345,745 350,735"/>

  <!-- Output summary box -->
  <rect fill="#e0e7ff" height="55" rx="6" stroke="#6366f1" stroke-width="1.5" width="400" x="145" y="750"/>
  <text fill="#4338ca" font-size="11" font-weight="bold" text-anchor="middle" x="345" y="772">OUTPUT TO STAGE 4</text>
  <text fill="#4338ca" font-size="10" text-anchor="middle" x="345" y="790">Target roles with rationale (2-3 per company)</text>

 </g>
</svg>
